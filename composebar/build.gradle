// 校园服务 · Compose 底栏模块
// 引入 KernelSU 真实源码 + miuix-blur，实现与 KSU 管理器完全一致的液态玻璃底栏
plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'GJJX.zzzwt.ltd.compose'
    compileSdk 37

    defaultConfig {
        minSdk 28          // 与主 App 一致；miuix-blur 内部自行判断 API 33+
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
        buildConfig false
    }
}

dependencies {
    constraints {
        implementation('androidx.compose.runtime:runtime-android:1.7.8')
        implementation('androidx.compose.ui:ui-android:1.7.8')
        implementation('androidx.compose.foundation:foundation-android:1.7.8')
        implementation('androidx.compose.animation:animation-android:1.7.8')
        implementation('androidx.compose.ui:ui-graphics-android:1.7.8')
        implementation('androidx.compose.ui:ui-unit-android:1.7.8')
        implementation('androidx.compose.ui:ui-text-android:1.7.8')
        implementation('androidx.compose.foundation:foundation-layout-android:1.7.8')
    }
    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.compose.runtime:runtime'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    // KSU 同款：miuix-blur（Backdrop/drawBackdrop/lens/vibrancy 引擎）
    api 'top.yukonga.miuix.kmp:miuix-blur-android:0.9.4'
    api 'top.yukonga.miuix.kmp:miuix-android:0.8.8'
}